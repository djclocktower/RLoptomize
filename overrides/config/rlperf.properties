# RLPerf: performance patches made for this pack. Source is in the rlperf/ folder of the pack's repository.
# Every patch is on unless its line says false. A patch that does not recognise the exact mod version
# it was written for switches itself off and says so in the log.

# OptiFine 1.12.2 HD U G5: parse shader pack options without rescanning every file once per option.
# Shortens game launch with a shader pack selected, and every shader reload.
optifineShaderParser=true

# Better Caves 1.12.2-2.0.4: keep cave noise in plain arrays. Caves generate block-for-block the same.
betterCavesNoise=true

# While a chunk is being populated, do not generate neighbouring chunks only to deliver a block update to them.
populateCascadeGuard=true
